# =============================================================================
# APP-10 OnboardR — reverse proxy Nginx DEDIE (Banking DAST Benchmark Lab).
# Donnees 100% fictives, usage defensif. Securise par defaut SAUF aux ecarts
# tagues "# GT: APP10-Vxxx". Les ecarts de couche Reverse Proxy vivent ICI :
#   V001 (passthrough en-tete de confiance), V002 (X-Forwarded-* non reecrits),
#   V003 (filtrage avant normalisation), V005 (CL.TE), V011 (en-tetes internes non
#   masques), V012 (cache sans cle sur en-tete), V014 (en-tetes de securite absents),
#   V015 (service statique mal ancre). NC: N001, N002.
#
# DEPLOIEMENT EB Single Instance (sans ALB) : le proxy termine lui-meme le TLS sur 443
# (certificat autosigne genere au demarrage du conteneur, CN=$TLS_CN) et redirige 80 -> 443.
# Le routage applicatif (et donc TOUS les ecarts ci-dessus) est servi par le serveur 443.
# =============================================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Cache de laboratoire pour /api/config (voir V012).
    proxy_cache_path /var/cache/nginx/labcache levels=1:2 keys_zone=labcache:10m max_size=50m inactive=10m;

    # Garde d'hôte canonique : en mode letsencrypt, docker-entrypoint-tls.sh écrit ici un serveur 443
    # qui redirige l'ancienne URL EB (*.elasticbeanstalk.com) vers https://$TLS_CN (= app10.<LAB_DOMAIN>).
    # En mode selfsigned le dossier reste vide (glob sans correspondance = toléré par nginx).
    include /etc/nginx/guard/*.conf;

    # X-Service / X-Service-Version / X-Upstream emis par les microservices amont.
    # (Correctif attendu : proxy_hide_header X-Service; proxy_hide_header X-Service-Version; ...)

    upstream kyc { server kyc-internal:8080; keepalive 16; }
    upstream documents    { server documents:3000;    keepalive 16; }

    # Enchaine les requetes sur des connexions keep-alive vers l'amont.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ---- HTTPS obligatoire : redirection 80 -> 443 (sans exception) --------------------
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---- Serveur applicatif (TLS termine sur l'instance) -------------------------------
    server {
        listen 443 ssl default_server;
        server_name onboardr.lab.exemple;

        # Certificat autosigne genere au demarrage (docker-entrypoint-tls.sh, CN=$TLS_CN=CNAME EB).
        ssl_certificate     /etc/nginx/certs/dastlab.crt;
        ssl_certificate_key /etc/nginx/certs/dastlab.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ni X-Content-Type-Options, ni X-Frame-Options, ni Content-Security-Policy).
        # (Correctif attendu : add_header Strict-Transport-Security ... ; add_header X-Frame-Options ... ; etc.)

        # ---- Accueil -------------------------------------------------------
        location = / {
            proxy_pass http://kyc;
        }

        # ---- Repli : routes applicatives de haut niveau (/login, /logout, /onboarding, /admin...) ----
        # Les locations spécifiques ci-dessous (=, ^~, regex, /api/, /static, /assets/) gardent la
        # priorité (nginx : préfixe le plus long / exact / regex d'abord) ; ce repli n'attrape que le reste.
        location / {
            proxy_pass http://kyc;
        }

        # ---- Reinitialisation de laboratoire -------------------------------
        location = /admin/reset {
            proxy_pass http://kyc;
        }

        # ---- Console d'administration (bloquee par le proxy) ---------------
        # La console canonique est bloquee, mais la regle est contournable par une forme
        # encodee (/api/..%2fadmin) que le backend normalise vers la zone admin.
        location = /api/admin        { return 403; }
        location ^~ /api/admin/reports { return 403; }

        # ---- Ressources d'administration frere (NC) ------------------------
        # NC: APP10-N002 — la zone /api/admin/reports reste protegee : meme contournee au proxy
        # par normalisation, l'autorisation est dupliquee cote application (role CONFORMITE).

        # ---- Routes internes du service KYC --------------------------------
        # NC: APP10-N001 — endpoint interne de metriques CORRECTEMENT securise : le proxy
        # SUPPRIME tout X-Internal-Auth fourni par le client et RE-INJECTE le secret de
        # passerelle non devinable ; il reecrit aussi les X-Forwarded-*. Le backend exige ce secret.
        # NC: APP10-N001 — les metriques internes NE SONT PAS exposees via le proxy public :
        # tout acces externe est refuse (403). Le monitoring legitime interroge le backend
        # directement sur le reseau Docker (secret de passerelle), jamais via ce vhost public.
        # Un X-Internal-Auth ou un X-Forwarded-* forge ne donne donc aucun acces.
        location = /internal/kyc/metrics { return 403; }

        # forger cet en-tete de confiance "en clair" et atteindre les routes internes.
        # (Correctif attendu : proxy_set_header X-Internal-Auth ""; + mTLS/secret non devinable.)
        location ^~ /internal/kyc {
            # (pas de proxy_set_header X-Internal-Auth "" : l'en-tete client est transmis tel quel)
            proxy_pass http://kyc;
        }

        # ---- Service statique du proxy -------------------------------------
        # permet de remonter hors de la racine statique (/static/../ -> traversal).
        location /static {
            alias /usr/share/nginx/html/static/;
            autoindex on;
        }

        # NC: APP10-N002 — service statique frere CORRECTEMENT ancre (slash final coherent),
        # sans remontee possible hors de la racine dediee.
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
        }

        # ---- Configuration publique (mise en cache) ------------------------
        # backend) mais cet en-tete n'entre PAS dans la cle de cache : une reponse empoisonnee
        # est resservie aux autres clients. X-Forwarded-Host client est transmis tel quel.
        location ^~ /api/config {
            proxy_cache labcache;
            proxy_cache_key "$scheme$request_method$host$request_uri";   # pas de X-Forwarded-Host
            proxy_cache_valid 200 60s;
            add_header X-Cache $upstream_cache_status;
            proxy_pass http://kyc;
        }

        # ---- Ecarts de couche API/application (routes par les locations existantes) -------
        # Les vulnerabilites APP10-V016..V021 sont portees COTE SERVICE (pas au proxy) :
        #   V016 CORS reflechi+credentials, V017 enum de comptes, V019 open redirect  -> service kyc (Java),
        #     via /api/account/* et /api/journey/* (captures par `location /api/` plus bas).
        #   V018 XSS reflechi (/api/support/search), V020 JWT inter-service non verifie
        #     (/api/documents/import), V021 excessive data exposure (/api/documents/*/details)
        #     -> service documents (Node), captures par les regex /api/(documents|support) ci-dessous.
        # NC jumeaux N008..N013 : memes routes "/safe", "/verified", "/summary", "/activity",
        #   "/magic-link", "/journey/resume". Le proxy ne corrige aucun de ces ecarts applicatifs
        #   (p.ex. il ne retire pas l'Access-Control-Allow-Origin reflechi par le backend — V016).

        # ---- Pieces / documents -> service documents (Node) ----------------
        location ~ ^/api/onboarding/[^/]+/documents { proxy_pass http://documents; }
        location ~ ^/api/onboarding/[^/]+/selfie    { proxy_pass http://documents; }
        location ~ ^/api/(documents|enrichment|support) { proxy_pass http://documents; }

        # ---- API onboarding -> service KYC (Java) --------------------------
        # ils sont transmis tels quels a l'amont, qui en derive une "confiance reseau interne".
        # (Correctif attendu : proxy_set_header X-Forwarded-Host $host; X-Forwarded-For $remote_addr.)
        #
        # ($request_uri), que le backend normalise differemment du filtrage proxy ci-dessus.
        #
        # keep-alive vers l'amont et ne rejette pas une requete portant a la fois Content-Length
        # et Transfer-Encoding ; proxy et backend peuvent se desynchroniser sur la delimitation
        # du corps. (Correctif attendu : rejet des requetes CL+TE, HTTP/2 amont, pas de reemploi.)
        location /api/ {
            proxy_pass http://kyc$request_uri;
        }
    }
}
