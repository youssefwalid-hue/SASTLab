# Positionne ici (contexte server, inclus dans les serveurs :80 et :443) et non au niveau http (doublon avec EB).
server_tokens on;

# APP-01 Helios Banque — contexte server (inclus par EB dans le bloc server{}).
#
# Regle de filtrage des endpoints de gestion au niveau du reverse proxy.
# location ^~ /actuator capture aussi bien la forme canonique (/actuator/env) que la forme
# normalisee de la traversee (/actuator/../actuator/env -> /actuator/env).
#
# BRUTE : seul le chemin canonique renvoie 403, la forme ../ est transmise au backend qui la
# normalise vers /actuator/env (endpoint expose par l'application, cf. APP01-V013).
location ^~ /actuator {
    if ($helios_actuator_block) {
        return 403;
    }
    # Pour la forme ../ (non bloquee), on transmet au backend le chemin NORMALISE ($uri = /actuator/env)
    # et non l'URI brute : Spring Security 6 ne mappe pas un chemin contenant '..' sur /actuator/** (il
    # tomberait sur anyRequest().authenticated() -> 302 login), alors que /actuator/env normalise est servi
    # en 200 par permitAll("/actuator/**"). La divergence proxy/backend (403 canonique vs 200 via ../) est
    # ainsi reellement observable (exposition anonyme de la configuration).
    proxy_pass          http://127.0.0.1:5000$uri$is_args$args;
    proxy_http_version  1.1;
    proxy_set_header    Connection          "";
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Host    $host;
    proxy_set_header    X-Forwarded-Proto   $scheme;
}

# (La terminaison TLS est assuree par Nginx sur l'instance ; le proxy n'ajoute volontairement pas de politique HSTS.)
