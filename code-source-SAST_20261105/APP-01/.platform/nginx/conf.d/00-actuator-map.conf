# APP-01 Helios Banque — contexte http (inclus par EB dans le bloc http{}).
#
# server (elasticbeanstalk/01-actuator.conf) : au niveau http, la directive serait en double avec celle du
# nginx.conf d'Elastic Beanstalk ("server_tokens" directive is duplicate) et bloquerait tout le proxy.

# Cette "map" calcule un drapeau de blocage SENSIBLE A LA FORME LITTERALE du chemin
# ($request_uri = URI brute, non normalisee). La forme canonique /actuator... est bloquee,
# mais une forme contenant ../ y echappe alors que le backend (Tomcat/Spring) la normalise
# vers /actuator/env : divergence de normalisation proxy <-> backend.
map $request_uri $helios_actuator_block {
    default                 0;
    "~*^/actuator/\.\."     0;   # forme avec traversee : NON bloquee (ecart V015)
    "~*^/actuator"          1;   # forme canonique : bloquee au niveau du proxy
}
