<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments :: head('Notifications')}"></head>
<body>
<div th:replace="~{fragments :: labBanner}"></div>
<header th:replace="~{fragments :: header('notifications', ${username})}"></header>

<main class="container">
    <h1>Notifications</h1>

    <section class="panel">
        <table class="table">
            <thead>
            <tr><th>Date</th><th>Catégorie</th><th>Message</th><th>Statut</th></tr>
            </thead>
            <tbody>
            <tr th:each="n : ${notifications}">
                <td th:text="${n.createdAt}">2026-01-01</td>
                <!-- Rendu échappé (th:text) : route bénigne -->
                <td th:text="${n.category}">information</td>
                <td th:text="${n.message}">message</td>
                <td>
                    <span th:if="${n.unread}" class="badge badge-wait">Non lue</span>
                    <span th:unless="${n.unread}" class="badge badge-ok">Lue</span>
                </td>
            </tr>
            <tr th:if="${notifications.isEmpty()}"><td colspan="4" class="muted">Aucune notification.</td></tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
