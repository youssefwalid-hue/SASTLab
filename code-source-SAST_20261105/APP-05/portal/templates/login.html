{% extends "base.html" %}
{% block title %}Connexion — CréditFlux{% endblock %}
{% block content %}
<div class="card" style="max-width:420px">
  <h2>Connexion</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <p><label>Utilisateur<br><input name="username" autocomplete="username"></label></p>
    <p><label>Mot de passe<br><input type="password" name="password" autocomplete="current-password"></label></p>
    <button type="submit">Se connecter</button>
  </form>
  <p class="muted">Comptes de laboratoire : emprunteur1, emprunteur2, analyste1 — mot de passe fictif Password1!</p>
</div>
{% endblock %}
