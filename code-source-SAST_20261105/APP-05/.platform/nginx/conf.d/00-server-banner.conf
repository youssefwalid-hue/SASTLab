# 00-server-banner.conf — APP-05 CréditFlux (Banking DAST Benchmark Lab) — données 100 % fictives
#
# Contexte : la terminaison TLS du lab impose un proxy nginx (HTTPS obligatoire sur
# instance Single Instance). Par défaut nginx masque l'en-tête `Server` de l'upstream
# et émet le sien (`Server: nginx`), ce qui masquait la bannière gunicorn — alors qu'un
# déploiement Django/gunicorn exposé directement la laisse fuiter. `proxy_pass_header`
# retransmet au client l'en-tête `Server` émis par gunicorn, reproduisant fidèlement
# l'écart V016 derrière le proxy (observable par Qualys WAS / Escape).
#
# Fichier inclus au niveau http (conf.d/*.conf d'EB) → hérité par le serveur 443 et sa
# location /. Spécifique à APP-05 (les autres apps gardent leur propre gestion de bannière).
proxy_pass_header Server;
